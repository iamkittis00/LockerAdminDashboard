name: Deploy locker-admin

# Deploys the React frontend and the FastAPI backend to the VPS, then restarts
# the API service. Runs on every push to main, and can be run by hand from the
# Actions tab. See DEPLOY.md for the values below and for rollback steps.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # --- Fill these in to match the server (see DEPLOY.md) -------------------
  SSH_PORT: '222'
  REMOTE_FRONTEND_DIR: /var/www/lockerV1/dist
  REMOTE_BACKEND_DIR: /var/www/lockerV1/backend
  REMOTE_VENV: /var/www/lockerV1/backend/venv
  SERVICE_NAME: locker-api.service
  HEALTHCHECK_URL: http://127.0.0.1:8885/api/ping
  # ------------------------------------------------------------------------

# Two deploys overlapping would restart the service mid-rsync. Queue instead.
concurrency:
  group: deploy-locker-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stop with an actionable message instead of a confusing SSH failure
      # halfway through. Until the secrets and the paths in `env:` above are
      # filled in, this workflow cannot reach the server at all.
      - name: Preflight - deploy configured?
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          missing=""
          [ -z "$SERVER_HOST" ]    && missing="$missing SERVER_HOST"
          [ -z "$SERVER_USER" ]    && missing="$missing SERVER_USER"
          [ -z "$SERVER_SSH_KEY" ] && missing="$missing SERVER_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Deploy is not configured yet. Missing secret(s):$missing"
            echo ""
            echo "Set them with (from the ManagerIntern repo):"
            echo "  scripts/set-deploy-secrets.ps1 -Repo ${{ github.repository }}"
            echo ""
            echo "Then confirm the server paths in the 'env:' block at the top of"
            echo "this workflow against the real box - see DEPLOY.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Gate the deploy on the test suite. Restarting the API is a real outage
      # window — better to fail here than to find out after the service is down.
      - name: Lint and test frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Same gate for the backend. This is the half that restarts a live
      # service, so a broken auth check here means an outage, not a bad build.
      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          python -m pytest -q

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload frontend build
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            frontend/dist/ \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$REMOTE_FRONTEND_DIR/"

      # No --delete anywhere, and .env is excluded deliberately: production
      # secrets live only on the server. venv/__pycache__ are machine-specific.
      - name: Upload backend source
        run: |
          rsync -avz \
            --exclude='.env' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            backend/ \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$REMOTE_BACKEND_DIR/"

      - name: Install deps, restart service, health check
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" bash -s <<EOF
            set -euo pipefail
            "$REMOTE_VENV/bin/pip" install --quiet -r "$REMOTE_BACKEND_DIR/requirements.txt"
            sudo systemctl restart "$SERVICE_NAME"

            # Give the service a moment, then confirm it actually came back.
            # Without this the job would go green even if the API died on boot.
            for i in \$(seq 1 15); do
              if curl -fsS "$HEALTHCHECK_URL" >/dev/null 2>&1; then
                echo "healthcheck ok after \$i attempt(s)"
                exit 0
              fi
              sleep 2
            done

            echo "Healthcheck FAILED — service did not respond. Recent logs:" >&2
            sudo journalctl -u "$SERVICE_NAME" -n 40 --no-pager >&2
            exit 1
          EOF

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
